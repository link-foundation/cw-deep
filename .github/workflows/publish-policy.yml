name: Publish policy

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  publish-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Verify contract registry publishing is disabled
        run: python3 experiments/check_publish_policy.py
